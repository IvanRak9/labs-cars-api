app = "lab6-cars-api-rak"
primary_region = "ams"

[build]
dockerfile = "Dockerfile"

[env]
NODE_ENV = "production"
PORT = "3000"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0
processes = ["app"]

[[http_service.checks]]
grace_period = "15s"
interval = "10s"
method = "GET"
timeout = "3s"
path = "/health"